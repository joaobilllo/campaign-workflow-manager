<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logs - Naty Campaigns</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Chakra+Petch:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="dot"></span>
          <div>
            <strong>Naty Campaigns</strong>
            <small>v2.0 local</small>
          </div>
        </div>
        <nav class="menu">
          <a href="integration.html" class="item" data-page="integration">Integracoes</a>
          <a href="campaign.html" class="item" data-page="campaign">Campanha</a>
          <a href="contatos.html" class="item" data-page="contatos">Contatos</a>
          <a href="routes.html" class="item" data-page="routes">Rotas</a>
          <a href="logs.html" class="item" data-page="logs">Logs</a>
        </nav>
      </aside>

      <main class="workspace">
        <header class="topbar card">
          <div>
            <h1>Logs</h1>
            <p>Historico dos ultimos envios executados pelo painel.</p>
          </div>
        </header>

        <section class="card form-card">
          <div class="form-actions logs-actions">
            <button type="button" id="clearLogsBtn" class="danger-btn">Limpar logs</button>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Campanha</th>
                  <th>Status</th>
                  <th>Enviados</th>
                  <th>Detalhes</th>
                </tr>
              </thead>
              <tbody id="logsTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="shared.js"></script>
    <script src="logs.js"></script>
  </body>
</html>
